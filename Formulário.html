<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Produtos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    .catalogo {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }
    .produto {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .produto img {
      max-width: 100%;
      height: auto;
      border-radius: 5px;
    }
    .produto h2 {
      font-size: 18px;
      margin: 10px 0;
      text-align: center;
    }
    .produto p {
      font-size: 14px;
      color: #555;
      text-align: right;
    }
  
    .botao {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 15px;
      background: #264653;
      color: #fff;
      text-decoration: none;
      border-radius: 5px;
      
    }
    .botao:hover {
      background: #1d3557;
    }
  </style>
</head>
<body>
  <header>
    <img src="">
  </header>
  <h1>Catálogo de Produtos</h1>
  <div class="catalogo">
    <div class="produto">
      <img src="livro.jpg" width="90px" height="100px">
      <h2>Produto 1</h2>
      <p>Descrição breve do produto 1.</p>
      <div class="preco">R$ 99,90</div>
      <a href="#" class="botao">Comprar</a>
    </div>
    <div class="produto">
      <img src="https://via.placeholder.com/200" alt="Produto 2">
      <h2>Produto 2</h2>
      <p>Descrição breve do produto 2.</p>
      <div class="preco">R$ 149,90</div>
      <a href="#" class="botao">Comprar</a>
    </div>
    <div class="produto">
      <img src="https://via.placeholder.com/200" alt="Produto 3">
      <h2>Produto 3</h2>
      <p>Descrição breve do produto 3.</p>
      <div class="preco">R$ 199,90</div>
      <a href="#" class="botao">Comprar</a>
    </div>
  </div>
</body>
</html>
